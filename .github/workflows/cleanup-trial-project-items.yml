name: Cleanup Trial Project Items

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cleanup-trial-project-items.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete TRIAL draft items from Project #2
        env:
          GH_TOKEN: ${{ secrets.NMR_PROJECT_TOKEN }}
        run: |
          set -euo pipefail

          gh api graphql \
            -F number=2 \
            -f query='query($number:Int!) {
              viewer {
                login
                projectV2(number:$number) {
                  id
                  title
                  items(first:100) {
                    nodes {
                      id
                      content {
                        __typename
                        ... on DraftIssue { id title }
                      }
                    }
                  }
                }
              }
            }' > /tmp/project.json

          viewer="$(jq -r '.data.viewer.login' /tmp/project.json)"
          project_id="$(jq -r '.data.viewer.projectV2.id // empty' /tmp/project.json)"
          project_title="$(jq -r '.data.viewer.projectV2.title // empty' /tmp/project.json)"

          if [[ "$viewer" != 'TheAdA-NMR' || -z "$project_id" ]]; then
            echo "::error::Could not resolve TheAdA-NMR Project #2."
            exit 1
          fi

          deleted=0
          while IFS= read -r item_id; do
            [[ -z "$item_id" ]] && continue
            gh api graphql \
              -f project="$project_id" \
              -f item="$item_id" \
              -f query='mutation($project:ID!, $item:ID!) {
                deleteProjectV2Item(input:{projectId:$project, itemId:$item}) {
                  deletedItemId
                }
              }' >/dev/null
            deleted=$((deleted + 1))
          done < <(
            jq -r '.data.viewer.projectV2.items.nodes[]?
              | select(.content.__typename=="DraftIssue")
              | select((.content.title // "") | startswith("[TRIAL-001] ") or startswith("[TRIAL-002] "))
              | .id' /tmp/project.json
          )

          echo "Project: $project_title"
          echo "Deleted trial item(s): $deleted"
