name: Cleanup Stale S01 Project Items

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cleanup-stale-s01-project-items.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete stale S01 draft items from Project #2
        env:
          GH_TOKEN: ${{ secrets.NMR_PROJECT_TOKEN }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          ids = []
          for raw in Path('02-General-TODO-List/README.md').read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if line.startswith('| S01-'):
                  ids.append(line.strip('|').split('|')[0].strip())
          Path('/tmp/allowed-s01.txt').write_text('\n'.join(ids) + ('\n' if ids else ''), encoding='utf-8')
          print('Allowed S01 IDs:', ', '.join(ids))
          PY

          gh api graphql \
            -F number=2 \
            -f query='query($number:Int!) {
              viewer {
                login
                projectV2(number:$number) {
                  id
                  title
                  items(first:100) {
                    nodes {
                      id
                      content {
                        __typename
                        ... on DraftIssue { title }
                      }
                    }
                  }
                }
              }
            }' > /tmp/project.json

          viewer="$(jq -r '.data.viewer.login' /tmp/project.json)"
          project_id="$(jq -r '.data.viewer.projectV2.id // empty' /tmp/project.json)"
          project_title="$(jq -r '.data.viewer.projectV2.title // empty' /tmp/project.json)"

          if [[ "$viewer" != 'TheAdA-NMR' || -z "$project_id" ]]; then
            echo "::error::Could not resolve TheAdA-NMR Project #2."
            exit 1
          fi

          deleted=0
          while IFS=$'\t' read -r item_id title; do
            [[ -z "$item_id" ]] && continue
            if [[ "$title" =~ ^\[(S01-[0-9]+)\] ]]; then
              todo_id="${BASH_REMATCH[1]}"
              if ! grep -Fxq "$todo_id" /tmp/allowed-s01.txt; then
                gh api graphql \
                  -f project="$project_id" \
                  -f item="$item_id" \
                  -f query='mutation($project:ID!, $item:ID!) {
                    deleteProjectV2Item(input:{projectId:$project, itemId:$item}) { deletedItemId }
                  }' >/dev/null
                echo "Deleted stale item: $todo_id"
                deleted=$((deleted + 1))
              fi
            fi
          done < <(jq -r '.data.viewer.projectV2.items.nodes[]? | select(.content.__typename=="DraftIssue") | [.id, (.content.title // "")] | @tsv' /tmp/project.json)

          echo "Project: $project_title"
          echo "Deleted stale S01 item(s): $deleted"
